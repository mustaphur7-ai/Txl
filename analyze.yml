name: Daily levels analysis
on:
  schedule:
    - cron: "33 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: levels
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python make_levels.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- levels.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add levels.json
            git commit -m "Update levels"
            git pull --rebase
            git push
          fi
