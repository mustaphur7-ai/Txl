<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTCUSD Levels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>BTCUSD Levels</h1>
    <div id="price">--</div>
    <p class="muted"><span id="dot"></span> <span id="updated">Connecting</span></p>
  </header>
  <div id="banner" hidden></div>
  <dl>
    <div><dt>Analysis time (Kenya)</dt><dd id="analyzed">--</dd></div>
    <div><dt>Next analysis in</dt><dd id="countdown">--</dd></div>
    <div><dt>Spot at analysis</dt><dd id="spot">--</dd></div>
    <div><dt>Expected daily move</dt><dd id="move">--</dd></div>
  </dl>
  <h2>Levels</h2>
  <ul id="ladder"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
